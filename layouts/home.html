{{ define "main" }}
<div class='mainbg' style="position: relative; min-height: 100vh; overflow: hidden;">
    {{ if .Site.Params.backgroundImage }}
        <img src="{{ .Site.Params.backgroundImage | relURL }}" alt="Background" class="background-image">
    {{ else }}
        <video autoplay muted loop style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover;">
            <source src="{{ "bg.mp4" | relURL }}" type="video/mp4">
        </video>
    {{ end }}

    <div class='content' style="position: relative; z-index: 10;">
        <div>
            <div class='contenthead'>
                <h3 class='contentheading'>{{ .Site.Params.title }}</h3>
            </div>
            <div class='contenttypewritter animatedText'></div>
            
            <div class='contentbtn'>
                {{ range .Site.Params.links }}
                    <a href="{{ .url }}" class='btn btn-outline-light' role='button' 
                       {{ if .newTab }} target="_blank" {{ end }}>
                       {{ .name }}
                    </a>
                {{ end }}
            </div>
        </div>
    </div>

    {{ if .Site.Params.footer }}
    <div style="position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 100;">
        <p style="color: rgba(255,255,255,0.4); font-size: 0.85rem; font-family: monospace; margin: 0; padding: 0 20px;">
            {{ .Site.Params.footer }}
        </p>
    </div>
    {{ end }}
</div>

<script>
    const textArray = {{ .Site.Params.phrases | jsonify | safeJS }};
</script>
<script src='{{ "js/script.js" | relURL }}'></script>
{{ end }}
