{{ define "main" }}
<div>
    <div class='mainbg'>
        {{ if .Site.Params.backgroundImage }}
            <img src="{{ .Site.Params.backgroundImage | relURL }}" alt="Background" class="background-image">
        {{ else }}
            <video autoplay muted loop class="bg-video" style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover;">
                <source src="{{ "bg.mp4" | relURL }}" type="video/mp4">
            </video>
        {{ end }}

        <div class='content' style="position: absolute; top: 10%; width: 100%; text-align: center;">
            <div>
                <div class='contenthead'>
                    <h1 class='contentheading' style="color: #00d4ff; font-size: 2.5rem;">{{ .Site.Params.title }}</h1>
                </div>
                <div class='contenttypewritter animatedText' style="margin-bottom: 30px;"></div>
                
                <div class='contentbtn' style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;">
                    {{ range .Site.Params.links }}
                        <a href="{{ .url }}" class='btn btn-outline-light' role='button' 
                           style="border: 1px solid #00d4ff; color: #00d4ff; padding: 10px 20px; text-decoration: none; min-width: 120px;"
                           {{ if .newTab }} target="_blank" {{ end }}>
                           {{ .name }}
                        </a>
                    {{ end }}
                </div>
            </div>
        </div>

        <div style="position: fixed; bottom: 20px; width: 100%; z-index: 999; pointer-events: none;">
            {{ partial "footer.html" . }}
        </div>
    </div>
</div>

<style>
    @media (max-width: 768px) {
        .bg-video {
            display: none !important;
        }
        .mainbg {
            background-color: #000;
        }
        .content {
            top: 5% !important; /* Pulls it up even higher on small screens */
        }
    }
</style>

<script>
    const textArray = {{ .Site.Params.phrases | jsonify | safeJS }};
</script>
<script src='{{ "js/script.js" | relURL }}'></script>
{{ end }}
