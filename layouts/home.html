{{ define "main" }}
<div class='mainbg'>
    {{ if .Site.Params.backgroundImage }}
        <img src="{{ .Site.Params.backgroundImage | relURL }}" alt="Background" class="background-image">
    {{ else }}
        <video autoplay muted loop class="bg-video">
            <source src="{{ "bg.mp4" | relURL }}" type="video/mp4">
        </video>
    {{ end }}

    <div id="sidebar-open" onclick="toggleSidebar()">☰</div>

    <div id="sidebar" class="sidebar">
        <div id="sidebar-close" onclick="toggleSidebar()">×</div>
        <div class="sidebar-links">
            {{ range .Site.Params.links }}
                <a href="{{ .url }}" {{ if .newTab }} target="_blank" {{ end }}>{{ .name }}</a>
            {{ end }}
        </div>
    </div>

    <div class='hero-section' style="min-height: 45vh; display: flex; align-items: flex-end; justify-content: center; text-align: center; padding-bottom: 20px;">
        <div style="width: 100%;">
            <div class="desktop-links">
                {{ range .Site.Params.links }}
                    <a href="{{ .url }}" class='btn' role='button' {{ if .newTab }} target="_blank" {{ end }}>
                       {{ .name }}
                    </a>
                {{ end }}
            </div>

            <div class='contenthead'>
                <h3 class='contentheading' style="margin-bottom: 5px;">{{ .Site.Params.title }}</h3>
            </div>
            <div class='contenttypewritter animatedText' style="min-height: 1.5em; color: #ffffff;"></div>
        </div>
    </div>

    <div class="about-me-container" style="max-width: 1100px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 30;">
        <div style="background: rgba(0, 0, 0, 0.7); border: 1px solid #333; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; border-radius: 12px; align-items: flex-start;">
            
            <div style="flex: 1; min-width: 280px;">
                <img src="/homeimages/aboutme.jpeg" alt="About Me" 
                     style="width: 100%; border-radius: 8px; border: 2px
