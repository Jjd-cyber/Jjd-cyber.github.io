{{ define "main" }}
<div class='mainbg'>
    {{ if .Site.Params.backgroundImage }}
        <img src="{{ .Site.Params.backgroundImage | relURL }}" alt="Background" class="background-image">
    {{ else }}
        <video autoplay muted loop class="bg-video" style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover;">
            <source src="{{ "bg.mp4" | relURL }}" type="video/mp4">
        </video>
    {{ end }}

    <div class='content' style="position: fixed; top: 0; left: 0; width: 100%; text-align: center; padding-top: 20px; z-index: 10;">
        <div>
            <div style="display: grid !important; grid-auto-flow: column; justify-content: center; gap: 30px; margin-bottom: 35px; padding: 0 10px;">
                {{ range .Site.Params.links }}
               p     <a href="{{ .url }}" class='btn' role='button' 
                       style="width: 145px !important; height: 40px !important; padding: 0 !important; display: flex !important; align-items: center; justify-content: center; font-size: 1rem !important; border-radius: 4px !important; margin: 0 !important; border: 2px solid #ffffff !important; color: #ffffff !important; font-weight: 600; background: transparent; 
                       text-shadow: 0 0 5px rgba(255,255,255,0.7), 0 0 10px rgba(255,255,255,0.3); 
                       box-shadow: 0 0 5px rgba(255,255,255,0.5), inset 0 0 5px rgba(255,255,255,0.2);
                       text-transform: uppercase; letter-spacing: 1px;"
                       {{ if .newTab }} target="_blank" {{ end }}>
                       {{ .name }}
                    </a>
                {{ end }}
            </div>

            <div class='contenthead'>
                <h3 class='contentheading' style="color: #ffffff !important; margin: 0; opacity: 1 !important; text-shadow: 0 0 5px rgba(255,255,255,0.7), 0 0 10px rgba(255,255,255,0.3); letter-spacing: 2px;">{{ .Site.Params.title }}</h3>
            </div>

            <div class='contenttypewritter animatedText' style="color: #ffffff !important; opacity: 1 !important; margin-top: 10px; text-shadow: 0 0 5px rgba(255,255,255,0.7), 0 0 10px rgba(255,255,255,0.3);"></div>
        </div>
    </div>

    <div style="position: fixed; bottom: 20px; width: 100%; z-index: 999; pointer-events: none;">
        {{ partial "footer.html" . }}
    </div>
</div>

<style>
    /* Cleaning up any theme-enforced vertical centering */
    .mainbg {
        display: block !important;
    }

    @media (max-width: 850px) {
        div[style*="grid-auto-flow: column"] {
            grid-auto-flow: row !important;
            gap: 15px !important;
        }
        .bg-video {
            display: none !important;
        }
        .mainbg {
            background-color: #000;
        }
    }
</style>

<script>
    const textArray = {{ .Site.Params.phrases | jsonify | safeJS }};
</script>
<script src='{{ "js/script.js" | relURL }}'></script>
{{ end }}
