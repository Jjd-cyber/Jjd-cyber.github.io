{{ define "main" }}
<div class='mainbg' style="position: relative; min-height: 100vh; background: black;">
    {{ if .Site.Params.backgroundImage }}
        <img src="{{ .Site.Params.backgroundImage | relURL }}" alt="Background" class="background-image" style="position: fixed; z-index: -2;">
    {{ else }}
        <video autoplay muted loop style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover; opacity: 0.8;">
            <source src="{{ "bg.mp4" | relURL }}" type="video/mp4">
        </video>
    {{ end }}

    <div class='content' style="position: relative; z-index: 10; min-height: 80vh;">
        <div>
            <div class='contenthead'>
                <h3 class='contentheading'>{{ .Site.Params.title }}</h3>
            </div>
            <div class='contenttypewritter animatedText'></div>
            
            <div class='contentbtn'>
                {{ range .Site.Params.links }}
                    <a href="{{ .url }}" class='btn btn-outline-light' role='button' 
                       {{ if .newTab }} target="_blank" {{ end }}>
                       {{ .name }}
                    </a>
                {{ end }}
            </div>
        </div>
    </div>

    <div style="position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 999; pointer-events: none;">
        {{ partial "footer.html" . }}
    </div>
</div>

<script>
    const textArray = {{ .Site.Params.phrases | jsonify | safeJS }};
</script>
<script src='{{ "js/script.js" | relURL }}'></script>
{{ end }}
