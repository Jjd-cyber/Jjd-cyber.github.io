{{ define "main" }}
<div class='mainbg'>
    {{ if .Site.Params.backgroundImage }}
        <img src="{{ .Site.Params.backgroundImage | relURL }}" alt="Background" class="background-image">
    {{ else }}
        <video autoplay muted loop class="bg-video">
            <source src="{{ "bg.mp4" | relURL }}" type="video/mp4">
        </video>
    {{ end }}

    <div id="sidebar-open" onclick="toggleSidebar()">☰</div>

    <div id="sidebar" class="sidebar">
        <div id="sidebar-close" onclick="toggleSidebar()">×</div>
        <div class="sidebar-links">
            {{ range .Site.Params.links }}
                <a href="{{ .url }}" {{ if .newTab }} target="_blank" {{ end }}>{{ .name }}</a>
            {{ end }}
        </div>
    </div>

    <div class='content'>
        <div>
            <div class="desktop-links">
                {{ range .Site.Params.links }}
                    <a href="{{ .url }}" class='btn' role='button' {{ if .newTab }} target="_blank" {{ end }}>
                       {{ .name }}
                    </a>
                {{ end }}
            </div>

            <div class='contenthead'>
                <h3 class='contentheading'>{{ .Site.Params.title }}</h3>
            </div>
            <div class='contenttypewritter animatedText'></div>
        </div>
    </div>

    <div class="footer-wrap">
        {{ partial "footer.html" . }}
    </div>
</div>

<style>
    .content { position: fixed; top: 0; left: 0; width: 100%; text-align: center; padding-top: 75px; z-index: 10; }
    
    /* Fixed Horizontal Grid for Desktop */
    .desktop-links { 
        display: grid !important; 
        grid-auto-flow: column !important; 
        justify-content: center !important; 
        gap: 30px !important; 
        margin-bottom: 35px !important; 
    }

    .btn { 
        width: 145px !important; height: 40px !important; display: flex !important; 
        align-items: center; justify-content: center; font-size: 1rem !important; 
        border-radius: 4px; border: 2px solid #ffffff; color: #ffffff; 
        font-weight: 600; text-shadow: 0 0 5px rgba(255,255,255,0.7); 
        box-shadow: 0 0 5px rgba(255,255,255,0.5); text-transform: none !important; 
    }
    
    .contentheading, .animatedText { color: #ffffff; text-shadow: 0 0 5px rgba(255,255,255,0.7); text-transform: none !important; }
    .bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover; }
    .footer-wrap { position: fixed; bottom: 20px; width: 100%; z-index: 999; pointer-events: none; }
    
    /* Sidebar CSS */
    .sidebar {
        height: 100%; width: 0; position: fixed; z-index: 10000; top: 0; right: 0;
        background-color: rgba(0, 0, 0, 0.95); overflow-x: hidden; transition: 0.5s; padding-top: 60px;
        border-left: 1px solid #333;
    }
    .sidebar-links a { padding: 15px 32px; text-decoration: none; font-size: 1.2rem; color: white; display: block; font-family: monospace; }
    #sidebar-open { display: none; position: fixed; top: 20px; right: 20px; font-size: 30px; color: white; cursor: pointer; z-index: 9998; }
    #sidebar-close { position: absolute; top: 10px; left: 20px; font-size: 36px; color: white; cursor: pointer; }

    @media (max-width: 850px) {
        .desktop-links { display: none !important; }
        #sidebar-open { display: block; }
        .bg-video { display: none; }
        .mainbg { background-color: #000; }
    }
</style>

<script>
    function toggleSidebar() {
        const sb = document.getElementById("sidebar");
        sb.style.width = sb.style.width === "250px" ? "0" : "250px";
    }
    const textArray = {{ .Site.Params.phrases | jsonify | safeJS }};
</script>
<script src='{{ "js/script.js" | relURL }}'></script>
{{ end }}
