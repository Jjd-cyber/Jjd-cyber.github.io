{{ define "main" }}
    <div>
        <div class='mainbg'>
            {{ if .Site.Params.backgroundImage }}
                <img src="{{ .Site.Params.backgroundImage | relURL }}" alt="Background" class="background-image">
            {{ else }}
                <video autoplay muted loop>
                    {{ if .Site.Params.backgroundVideo }}
                        <source src="{{ .Site.Params.backgroundVideo | relURL }}" type="video/mp4">
                    {{ else }}
                        <source src="{{ "bg.mp4" | relURL }}" type="video/mp4">
                    {{ end }}
                </video>
            {{ end }}
            
            <div class='content'>
                <div>
                    <div class='contenthead'>
                        <h3 class='contentheading'>{{ .Site.Params.title }}</h3>
                    </div>
                    <div class='contenttypewritter animatedText'></div>
                    
                    <div class='contentbtn'>
                        {{ range .Site.Params.links }}
                            <a href="{{ .url }}" class='btn btn-outline-light' role='button' 
                               {{ if .newTab }} target="_blank" {{ else }} target="_self" {{ end }}>
                               {{ .name }}
                            </a>
                        {{ end }}
                    </div>

                    {{ if .Site.Params.footer }}
                    <div style="margin-top: 2.5rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                        <p style="color: rgba(255,255,255,0.5); font-size: 0.85rem; letter-spacing: 1px; font-family: monospace;">
                            {{ .Site.Params.footer }}
                        </p>
                    </div>
                    {{ end }}

                </div>
            </div>
        </div>
    </div>

    <script>
        const textArray = {{ .Site.Params.phrases | jsonify | safeJS }};
    </script>
    <script src='{{ "js/script.js" | relURL }}'></script>
{{ end }}
