{{ define "main" }}
<div>
    <div class='mainbg'>
        {{ if .Site.Params.backgroundImage }}
            <img src="{{ .Site.Params.backgroundImage | relURL }}" alt="Background" class="background-image">
        {{ else }}
            <video autoplay muted loop class="bg-video" style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover;">
                <source src="{{ "bg.mp4" | relURL }}" type="video/mp4">
            </video>
        {{ end }}

        <div class='content' style="position: absolute; top: 10%; width: 100%; text-align: center;">
            <div>
                <div style="display: grid !important; grid-auto-flow: column; justify-content: center; gap: 20px; margin-bottom: 30px; padding: 0 10px;">
                    {{ range .Site.Params.links }}
                        <a href="{{ .url }}" class='btn' role='button' 
                           style="width: 140px !important; height: 40px !important; padding: 0 !important; display: flex !important; align-items: center; justify-content: center; font-size: 1rem !important; border-radius: 4px !important; margin: 0 !important; border: 2px solid #ffffff !important; color: #ffffff !important; font-weight: 600; background: transparent;"
                           {{ if .newTab }} target="_blank" {{ end }}>
                           {{ .name }}
                        </a>
                    {{ end }}
                </div>

                <div class='contenthead'>
                    <h3 class='contentheading' style="color: #ffffff !important; margin: 0; opacity: 1 !important;">{{ .Site.Params.title }}</h3>
                </div>

                <div class='contenttypewritter animatedText' style="color: #ffffff !important; opacity: 1 !important; margin-top: 10px;"></div>
            </div>
        </div>

        <div style="position: fixed; bottom: 20px; width: 100%; z-index: 999; pointer-events: none;">
            {{ partial "footer.html" . }}
        </div>
    </div>
</div>

<style>
    /* Hiding video on mobile and keeping layout consistent */
    @media (max-width: 850px) {
        div[style*="grid-auto-flow: column"] {
            grid-auto-flow: row !important;
            gap: 12px !important;
        }
        .bg-video {
            display: none !important;
        }
        .mainbg {
            background-color: #000;
        }
    }
</style>

<script>
    const textArray = {{ .Site.Params.phrases | jsonify | safeJS }};
</script>
<script src='{{ "js/script.js" | relURL }}'></script>
{{ end }}
