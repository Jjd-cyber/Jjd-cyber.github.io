{{ define "main" }}
<div>
    <div class='mainbg'>
        {{ if .Site.Params.backgroundImage }}
            <img src="{{ .Site.Params.backgroundImage | relURL }}" alt="Background" class="background-image">
        {{ else }}
            <video autoplay muted loop class="bg-video" style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover;">
                <source src="{{ "bg.mp4" | relURL }}" type="video/mp4">
            </video>
        {{ end }}

        <div class='content' style="position: absolute; top: 10%; width: 100%; text-align: center;">
            <div>
                <div class='contenthead'>
                    <h3 class='contentheading'>{{ .Site.Params.title }}</h3>
                </div>
                <div class='contenttypewritter animatedText'></div>
                
                <div style="display: grid !important; grid-auto-flow: column; justify-content: center; gap: 15px; margin-top: 30px; padding: 0 20px;">
                    {{ range .Site.Params.links }}
                        <a href="{{ .url }}" class='btn btn-outline-light' role='button' 
                           style="width: 160px !important; margin: 0 !important; display: flex !important; align-items: center; justify-content: center; height: 45px;"
                           {{ if .newTab }} target="_blank" {{ end }}>
                           {{ .name }}
                        </a>
                    {{ end }}
                </div>
            </div>
        </div>

        <div style="position: fixed; bottom: 20px; width: 100%; z-index: 999; pointer-events: none;">
            {{ partial "footer.html" . }}
        </div>
    </div>
</div>

<style>
    /* Mobile adjustments: Stack them only when the screen gets too thin */
    @media (max-width: 850px) {
        div[style*="grid-auto-flow: column"] {
            grid-auto-flow: row !important;
        }
        .bg-video {
            display: none !important;
        }
        .mainbg {
            background-color: #000;
        }
    }
</style>

<script>
    const textArray = {{ .Site.Params.phrases | jsonify | safeJS }};
</script>
<script src='{{ "js/script.js" | relURL }}'></script>
{{ end }}
