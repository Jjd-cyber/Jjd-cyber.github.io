{{ define "main" }}
<div class='mainbg' style="display: flex; flex-direction: column; min-height: 100vh;">
    
    <div class='content' style="flex: 1; padding: 40px;">
        <h1 class='contentheading' style="font-size: 1.5rem;">{{ .Title }}</h1>
        <hr style="border: 0.5px solid #333; margin-bottom: 20px;">
        
        <ul style="padding: 0; list-style: none;">
            {{ range .Pages }}
            <li style="margin-bottom: 15px;">
                <a href="{{ .Permalink }}" style="color: #00d4ff; font-size: 1.1rem; text-decoration: none; font-weight: bold;">
                    {{ .Title }}
                </a>
                <p style="color: #888; font-size: 0.9rem; margin: 2px 0;">{{ .Date.Format "Jan 2, 2006" }}</p>
            </li>
            {{ end }}
        </ul>

        <div style="margin-top: 50px;">
            <a href="/" style="text-decoration: none; color: #ffffff;">← Back to Home</a>
        </div>
    </div>

    {{ partial "footer.html" . }}
</div>
{{ end }}
