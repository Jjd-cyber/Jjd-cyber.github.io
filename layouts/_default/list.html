{{ define "main" }}
<div style="display: flex; flex-direction: column; min-height: 100vh; padding: 40px; color: white; font-family: monospace;">
    
    <div style="flex-grow: 1;">
        <h1 style="font-size: 1.5rem; margin-bottom: 5px;">{{ .Title }}</h1>
        <hr style="border: 0.5px solid #333; margin-bottom: 20px;">
        
        <ul style="padding: 0;">
            {{ range .Pages }}
            <li style="margin-bottom: 15px; list-style: none;">
                <a href="{{ .Permalink }}" style="color: #00d4ff; font-size: 1.1rem; text-decoration: none; font-weight: bold;">
                    {{ .Title }}
                </a>
                <p style="color: #888; font-size: 0.9rem; margin: 2px 0;">{{ .Date.Format "Jan 2, 2006" }}</p>
            </li>
            {{ end }}
        </ul>

        <div style="margin-top: 50px;">
            <a href="/" style="color: #666; font-size: 0.9rem; text-decoration: none;">← Back to Home</a>
        </div>
    </div>

    <div style="padding-top: 40px;">
        {{ partial "footer.html" . }}
    </div>
</div>
{{ end }}
