{{ define "main" }}
<div style="max-width: 800px; margin: 50px auto; padding: 20px; color: white; font-family: sans-serif;">
    <h1>{{ .Title }}</h1>
    <hr>
    <ul>
        {{ range .Pages }}
        <li style="margin-bottom: 20px; list-style: none;">
            <a href="{{ .Permalink }}" style="color: #00d4ff; font-size: 1.5rem; text-decoration: none;">
                {{ .Title }}
            </a>
            <p style="color: #ccc;">{{ .Date.Format "January 2, 2006" }}</p>
        </li>
        {{ end }}
    </ul>
    <a href="/" style="color: #aaa;">← Back to Home</a>
</div>
{{ end }}
