{{ define "main" }}
<div style="padding: 50px; text-align: left; color: white; font-family: monospace; min-height: 100vh; display: flex; flex-direction: column;">
    
    <h1 style="color: #00d4ff;">{{ .Title }}</h1>
    <p style="color: #888;">{{ .Date.Format "January 2, 2006" }}</p>
    <hr style="border: 0.5px solid #333;">
    
    <div style="line-height: 1.6; font-size: 1.1rem; margin-top: 20px; flex: 1;">
        {{ .Content }}
    </div>
    
    <div style="margin-top: 50px; margin-bottom: 50px; position: relative; z-index: 999;">
        <a href="/posts/" style="text-decoration: none; color: #00d4ff; border: 1px solid #00d4ff; padding: 10px 20px; display: inline-block; transition: 0.3s;">
            ← Back to Posts
        </a>
    </div>

    <div style="margin-top: auto; border-top: 1px solid #333;">
        {{ partial "footer.html" . }}
    </div>
</div>
{{ end }}
