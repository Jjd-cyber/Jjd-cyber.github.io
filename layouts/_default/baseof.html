<!DOCTYPE html>
<html lang="en">
<head>
    {{- partial "head.html" . -}}
    <link rel="icon" type="image/png" href="{{ "/favicon.png" | relURL }}?v=1">
    <style>
        /* Desktop Default: Fixed 120px logo */
        .master-logo {
            position: fixed !important;
            top: 20px !important;
            z-index: 9999 !important;
            width: 120px;
            height: auto;
            pointer-events: auto;
            transition: width 0.3s ease;
        }

        /* Mobile Only: Percentage scaling and tighter top lock */
        @media (max-width: 850px) {
            .master-logo {
                width: 15% !important;
                min-width: 65px !important;
                top: 10px !important;
            }

            /* This pushes the content down on ALL pages (About, Posts, etc) 
               specifically on mobile so the logo doesn't overlap text */
            .main-content-wrapper {
                padding-top: 100px !important;
            }
        }
    </style>
</head>
<body style="margin: 0; background: black; color: white; font-family: monospace;">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <a href="{{ "/" | absURL }}" style="display: block; position: relative; z-index: 9999;">
        <img src="{{ "/imagelogo.png" | absURL }}" alt="Logo" class="master-logo"
             style="{{ if eq .Section "posts" }} right: 20px !important; left: auto !important; {{ else }} left: 20px !important; right: auto !important; {{ end }}">
    </a>

    <div class="main-content-wrapper" style="position: relative; z-index: 20;">
        {{- block "main" . -}}{{- end -}}
    </div>
</body>
</html>
