<!DOCTYPE html>
<html lang="en">
<head>
    {{- partial "head.html" . -}}
    <link rel="icon" type="image/png" href="{{ "/favicon.png" | relURL }}?v=1">
    <style>
        .master-logo {
            position: absolute !important; /* Stays at the top, scrolls away */
            top: 20px !important;
            z-index: 9999 !important;
            width: 120px;
            height: auto;
        }

        @media (max-width: 850px) {
            .master-logo {
                width: 20% !important;
                top: 15px !important;
            }
            .main-content-wrapper {
                margin-top: 20px !important; 
            }
        }
    </style>
</head>
<body style="margin: 0; background: black; color: white; font-family: monospace; position: relative;">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <a href="{{ "/" | absURL }}">
        <img src="{{ "/imagelogo.png" | absURL }}" alt="Logo" class="master-logo"
             style="{{ if eq .Section "posts" }} right: 20px !important; {{ else }} left: 20px !important; {{ end }}">
    </a>

    <div class="main-content-wrapper" style="position: relative; z-index: 20;">
        {{- block "main" . -}}{{- end -}}
    </div>
</body>
</html>
