<!DOCTYPE html>
<html lang="en">
<head>
    {{- partial "head.html" . -}}
    <link rel="icon" type="image/png" href="{{ "/favicon.png" | relURL }}?v=1">
    <style>
        /* Base Logo Styles */
        .master-logo {
            /* If it's the home page, lock it to the screen (fixed). 
               Otherwise, lock it to the top of the page (absolute). */
            position: {{ if .IsHome }}fixed{{ else }}absolute{{ end }} !important;
            top: 20px !important;
            z-index: 9999 !important;
            width: 120px;
            height: auto;
            pointer-events: auto;
        }

        /* Mobile Adjustments */
        @media (max-width: 850px) {
            .master-logo {
                width: 20% !important;
                top: 15px !important;
            }

            /* Minimal space to prevent overlap without huge gaps */
            .main-content-wrapper {
                margin-top: 20px !important; 
                padding-top: 0 !important;
            }
        }
    </style>
</head>
<body style="margin: 0; background: black; color: white; font-family: monospace; position: relative;">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <a href="{{ "/" | absURL }}" style="display: block;">
        <img src="{{ "/imagelogo.png" | absURL }}" alt="Logo" class="master-logo"
             style="{{ if eq .Section "posts" }} right: 20px !important; {{ else }} left: 20px !important; {{ end }}">
    </a>

    <div class="main-content-wrapper" style="position: relative; z-index: 20;">
        {{- block "main" . -}}{{- end -}}
    </div>
</body>
</html>
