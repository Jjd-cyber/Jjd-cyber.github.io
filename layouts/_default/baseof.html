<!DOCTYPE html>
<html lang="en">
<head>
    {{- partial "head.html" . -}}
    <link rel="icon" type="image/png" href="{{ "/favicon.png" | relURL }}?v=1">
    <style>
        /* Base Logo Styles */
        .master-logo {
            position: absolute !important; /* Locks it to the top of the page, NOT the screen */
            top: 20px !important;
            z-index: 9999 !important;
            width: 120px; /* Desktop default */
            height: auto;
            pointer-events: auto;
        }

        /* Mobile Only Adjustments */
        @media (max-width: 850px) {
            .master-logo {
                width: 30% !important; /* Raised to 30% as requested */
                top: 15px !important;
            }

            /* Adjusts the content start point to prevent overlap without huge gaps */
            .main-content-wrapper {
                margin-top: 60px !important; 
            }
        }
    </style>
</head>
<body style="margin: 0; background: black; color: white; font-family: monospace; position: relative;">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <a href="{{ "/" | absURL }}" style="display: block;">
        <img src="{{ "/imagelogo.png" | absURL }}" alt="Logo" class="master-logo"
             style="{{ if eq .Section "posts" }} right: 20px !important; {{ else }} left: 20px !important; {{ end }}">
    </a>

    <div class="main-content-wrapper" style="position: relative; z-index: 20;">
        {{- block "main" . -}}{{- end -}}
    </div>
</body>
</html>
