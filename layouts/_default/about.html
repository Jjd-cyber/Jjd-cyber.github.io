{{ define "main" }}
<div class='mainbg' style="display: flex; flex-direction: column; min-height: 100vh;">
    
    <div class='content' style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 60px 20px 120px 20px; text-align: center;">
        
        <h1 style="color: #00ccff; font-family: monospace; font-size: 2.5rem; margin-bottom: 1.5rem;">
            {{ .Title }}
        </h1>
        
        <div class="post-content" style="max-width: 800px; color: white; font-family: monospace; line-height: 1.6; margin-bottom: 40px;">
            {{ .Content }}
        </div>
        
        <div style="position: relative; z-index: 9999;">
            <a href="/" style="text-decoration: none; color: #00ccff; border: 1px solid #00ccff; padding: 10px 20px; font-family: monospace;">
                ← Back to Home
            </a>
        </div>
    </div>

    {{ partial "footer.html" . }}
</div>
{{ end }}
