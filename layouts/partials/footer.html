{{ if .Site.Params.footer }}
<footer class="site-footer" style="text-align: center; padding: 10px 0; width: 100%; position: relative; z-index: 10;">
    
    <a href="{{ "/" | relURL }}">
        <img src="{{ "/imagelogo.png" | relURL }}" 
             class="{{ if eq .Section "posts" }}top-right-logo{{ else }}top-left-logo{{ end }}" 
             alt="Logo">
    </a>

    <p style="margin: 0; color: #ffffff; font-family: monospace; font-size: 1rem;">
        {{ .Site.Params.footer }}
    </p>

    <style>
        /* Base Logo Styling */
        .top-left-logo, .top-right-logo {
            position: fixed;
            top: 20px;
            width: 120px;
            height: auto;
            z-index: 1000;
        }

        /* Home/General Position */
        .top-left-logo {
            left: 20px;
            right: auto;
        }

        /* Posts Position */
        .top-right-logo {
            right: 20px;
            left: auto;
        }

        @media (max-width: 600px) {
            .top-left-logo, .top-right-logo {
                width: 70px;
                top: 10px;
            }
            .top-left-logo { left: 10px; }
            .top-right-logo { right: 10px; }
        }
    </style>
</footer>
{{ end }}
