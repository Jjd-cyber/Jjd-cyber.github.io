{{ if .Site.Params.footer }}
<footer class="site-footer" style="text-align: center; padding: 30px 0; width: 100%;">
    
    <img src="{{ "imagelogo.png" | relURL }}" 
         style="position: fixed; top: 20px; right: 20px; width: 200px; height: auto; z-index: 1000; pointer-events: none;" 
         alt="Logo">

    <p style="margin: 0; color: #ffffff; font-family: monospace; font-size: 1rem;">
        {{ .Site.Params.footer }}
    </p>

</footer>
{{ end }}
