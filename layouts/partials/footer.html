{{ if .Site.Params.footer }}
<footer class="site-footer" style="text-align: center; padding: 10px 0; width: 100%; position: relative; z-index: 10; pointer-events: none;">
    
    <img src="{{ "/imagelogo.png" | relURL }}" class="top-right-logo" alt="Logo">

    <p style="margin: 0; color: #ffffff; font-family: monospace; font-size: 1rem; pointer-events: auto;">
        {{ .Site.Params.footer }}
    </p>

    <style>
        .top-right-logo {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 120px;
            height: auto;
            z-index: 1000;
            /* Logo is already set to none so it doesn't block clicks */
            pointer-events: none; 
        }

        @media (max-width: 600px) {
            .top-right-logo {
                width: 70px;
                top: 10px;
                right: 10px;
            }
        }
    </style>
</footer>
{{ end }}
