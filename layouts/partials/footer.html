{{ if .Site.Params.footer }}
<footer class="site-footer" style="text-align: center; padding: 30px 0; width: 100%;">
    
    <img src="{{ "/imageslogo.png" | relURL }}" class="top-right-logo" alt="Logo">

    <p style="margin: 0; color: #ffffff; font-family: monospace; font-size: 1rem;">
        {{ .Site.Params.footer }}
    </p>

    <style>
        .top-right-logo {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 80px;
            height: auto;
            z-index: 1000;
            pointer-events: none;
        }

        /* If the screen is smaller than 600px (Mobile) */
        @media (max-width: 600px) {
            .top-right-logo {
                width: 50px; /* Make it smaller */
                top: 10px;   /* Move it closer to the corner */
                right: 10px;
                opacity: 0.8; /* Make it slightly see-through so text is legible underneath */
            }
        }
    </style>
</footer>
{{ end }}
